services:
  bdd:
    image: mariadb:lts  # Utilisation de la version Long Term Support
    restart: always      # Redémarre le conteneur s'il plante
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_USER: user
      MARIADB_PASSWORD: user
      MARIADB_DATABASE: MarsAI-database
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql 
    
  pma:
    image: phpmyadmin
    environment:
      PMA_HOST: bdd
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - bdd

volumes:
  db_data: